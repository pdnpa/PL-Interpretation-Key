site_name: Protected Landscapes Interpretation Key
site_url: https://pdnpa.github.io/PL-Interpretation-Key/
use_directory_urls: true

repo_url: https://github.com/pdnpa/PL-Interpretation-Key
edit_uri: edit/main/docs/

theme:
  name: material

  features:
    - navigation.sections

plugins:
  - search
  - git-revision-date-localized
  - macros

extra_css:
  - assets/stylesheets/extra.css

docs_dir: docs

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js
  
nav:
  - Introduction: index.md
  - Guidance:
      - Overview: guidance/data.md
      - Digitising rules: guidance/digitising-rules.md
      - Thresholds: guidance/thresholds.md
      - Shadow: guidance/shadow.md
      - QA checks: guidance/qa.md
  - Primary Observable Components:
      - A Abiotic Substrates:
        - a1 Bare mineral soil: classes/abiotic-substrates/bare-soil-mineral.md
        - a2 Bare rock or bedrock: classes/abiotic-substrates/bare-rock-bedrock.md
        - a3 Scree or coarse rocky debris: classes/abiotic-substrates/scree-coarse-rocky-debris.md
        - a4 Bare peat & eroding peat: classes/abiotic-substrates/bare-peat-eroding-peat.md
        - a5 Sand: classes/abiotic-substrates/sand.md
        - a6 Mud: classes/abiotic-substrates/mud.md
        - a7 Shingle or gravel: classes/abiotic-substrates/shingle-gravel.md
      - B Built & Hard Surfaces:
        - b1 Impervious hardstanding: classes/built-hard-surfaces/impervious-hardstanding.md
        - b2 Buildings & structures: classes/built-hard-surfaces/buildings-structures.md
        - b3 Transport surfaces: classes/built-hard-surfaces/transport-surfaces.md
        - b4 Artificial bare & disturbed: classes/built-hard-surfaces/artificial-bare-disturbed.md
        - b5 Wall: classes/built-hard-surfaces/wall.md
      - C Cropland Structure:
        - c1 Annual arable bare or seedbed: classes/cropland-structure/annual-arable-bare.md
        - c2 Annual arable crop canopy: classes/cropland-structure/annual-arable-crop-canopy.md
        - c3 Annual arable stubble: classes/cropland-structure/annual-arable-stubble.md
        - c4 Permanent row crop trellis rows: classes/cropland-structure/permanent-row-crop.md
      - V Vegetation Structure:
        - v1 Broadleaved canopy: classes/vegetation-structure/broadleaved-canopy.md
        - v2 Conifer canopy: classes/vegetation-structure/conifer-canopy.md
        - v3 Hedgerow: classes/vegetation-structure/hedgerow.md
        - v4 Scrub: classes/vegetation-structure/scrub.md
        - v5 Gorse-dominant scrub: classes/vegetation-structure/gorse-dominant-scrub.md
        - v6 Dwarf shrub heath structure: classes/vegetation-structure/dwarf-shrub-heath.md
        - v7 Brackenor fern: classes/vegetation-structure/bracken-dominant.md
        - v8 Short smooth grass sward: classes/vegetation-structure/short-smooth-grass.md
        - v9 Rough taller grass: classes/vegetation-structure/rough-taller-grass.md
        - v10 Tussocky grass: classes/vegetation-structure/tussocky-grass.md
        - v11 Dense or closed tussocky grass: classes/vegetation-structure/molinia-dominant.md
        - v12 Peatland grass, sedge & rush mix: classes/vegetation-structure/peatland-grass-rush-mosaic.md
        - v13 Rush-dominant: classes/vegetation-structure/rush-dominant.md
        - v14 Reedbed: classes/vegetation-structure/reedbed.md
        - v15 Tall herb fen & marsh mix: classes/vegetation-structure/tall-herb-fen-marsh.md
        - v16 Wet bryophyte carpet: classes/vegetation-structure/wet-bryophyte-carpet.md
        - v17 Clear-fell & brash-dominant: classes/vegetation-structure/clear-fell-brash.md
        - v18 Young plantation (rows visible): classes/vegetation-structure/young-plantation.md
        - v19 Tree whips & early planting: classes/vegetation-structure/tree-whips-early-planting.md
      - W Water:
        - w1 Open standing water: classes/water/open-standing-water.md
        - w2 Flowing or channel water: classes/water/flowing-channel-water.md
      - U Unclassified:
        - Overview: classes/unclassified/index.md