site_name: Protected Landscapes Interpretation Key
site_url: https://pdnpa.github.io/PL-Interpretation-Key/
use_directory_urls: true

repo_url: https://github.com/pdnpa/PL-Interpretation-Key
edit_uri: edit/main/docs/

theme:
  name: material

  features:
    - navigation.sections

plugins:
  - search
  - git-revision-date-localized
  - macros

extra_css:
  - assets/stylesheets/extra.css

docs_dir: docs

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js
  
nav:
  - Introduction: index.md
  - Guidance:
      - Overview: guidance/data.md
      - Digitising rules: guidance/digitising-rules.md
      - Thresholds: guidance/thresholds.md
      - Shadow: guidance/shadow.md
      - QA checks: guidance/qa.md
  - Classes:
    - A Artificial land:
        - a1 Urban and transport: classes/artificial-land/urban.md
        - a2 Quarries & derelict land: classes/artificial-land/quarries.md
        - a3 Open mosaic: classes/artificial-land/open-mosaic.md
        - a4 Walls: classes/artificial-land/walls.md

    - B Cropland:
        - Overview: classes/cropland/index.md
        - b1 Annual crops: classes/cropland/annual.md
        - b2 Permanent crops: classes/cropland/permanent.md
        - b3 Orchards: classes/cropland/orchards.md

    - C Woodland & Scrubland:
        - c1 Broadleaved woodland: classes/woodland/broadleaved.md
        - c1a Single trees: classes/woodland/broadleaved-single-trees.md
        - c1b Hedgerow trees: classes/woodland/broadleaved-hedgerow-trees.md
        - c2 Coniferous woodland: classes/woodland/coniferous.md
        - c2a Single trees: classes/woodland/coniferous-single-trees.md
        - c2b Hedgerow trees: classes/woodland/coniferous-hedgerow-trees.md
        - c4 Traditional orchard: classes/woodland/traditional-orchard.md
        - c5 Clear felled / newly planted: classes/woodland/felled.md
        - c6 Scrub: classes/woodland/scrub.md
        - c6a Gorse: classes/woodland/gorse.md
        - c7 Hedgerows: classes/woodland/hedgerows.md
        - c8 Bracken: classes/woodland/bracken.md

    - D Heathland & Moorland:
        - d1 Upland heath: classes/heathland/upland-heath.md
        - d2a Grass–sedge moorland: classes/heathland/grass-sedge.md
        - d2b Upland grass moorland: classes/heathland/grass-moor.md
        - d3 Lowland heath: classes/heathland/lowland-heath.md

    - E Grassland:
        - e1 Improved grassland: classes/grassland/improved.md
        - e2 Rough grassland: classes/grassland/rough.md
        - e2a Acid grassland: classes/grassland/acid.md
        - e2b Calcareous grassland: classes/grassland/calcareous.md
        - e2c Neutral grassland and meadow: classes/grassland/meadow.md

    - F Wetland:
        - f1 Freshwater fen, marsh and swamp: classes/wetland/fen.md
        - f1a Upland mire: classes/wetland/mire.md
        - f2 Saltmarsh: classes/wetland/saltmarsh.md
        - f3 Raised bog: classes/wetland/raised-bog.md
        - f4 Rushes: classes/wetland/rushes.md
        - f5 Reedbeds: classes/wetland/reedbed.md

    - G Bare land:
        - g1 Bare ground: classes/bare-land/ground.md
        - g2 Bare rock: classes/bare-land/rock.md
        - g3 Unconsolidated bare ground: classes/bare-land/unconsolidated.md
        - g3a Sand: classes/bare-land/sand.md
        - g3b Mud: classes/bare-land/mud.md
        - g3c Shingle: classes/bare-land/shingle.md
        - g5 Exposed peat: classes/bare-land/exposed-peat.md
        - g6 Scree: classes/bare-land/scree.md

    - R Water:
        - r1 Inland open water: classes/water/open-water.md
        - r2 Rivers and streams: classes/water/rivers.md

    - H Coastland:
        - h1 Sand dunes: classes/coastland/sand-dunes.md
        - h2 Coastal grazing marsh: classes/coastland/grazing-marsh.md
        - h3 Vegetated shingle: classes/coastland/vegetated-shingle.md

    - I Unclassified:
        - Overview: classes/unclassified/index.md
  - Primary Observable Components:
      - A Abiotic Substrates:
        - a1 Bare soil / mineral: classes/abiotic-substrates/bare-soil-mineral.md
        - a2 Bare rock / bedrock: classes/abiotic-substrates/bare-rock-bedrock.md
        - a3 Scree / coarse rocky debris: classes/abiotic-substrates/scree-coarse-rocky-debris.md
        - a4 Bare peat / eroding peat: classes/abiotic-substrates/bare-peat-eroding-peat.md
        - a5 Sand: classes/abiotic-substrates/sand.md
        - a6 Mud: classes/abiotic-substrates/mud.md
        - a7 Shingle / gravel: classes/abiotic-substrates/shingle-gravel.md
      - B Built & Hard Surfaces:
        - b1 Impervious hardstanding: classes/built-hard-surfaces/impervious-hardstanding.md
        - b2 Buildings / structures: classes/built-hard-surfaces/buildings-structures.md
        - b3 Transport surfaces: classes/built-hard-surfaces/transport-surfaces.md
        - b4 Artificial bare / disturbed: classes/built-hard-surfaces/artificial-bare-disturbed.md
        - b5 Wall: classes/built-hard-surfaces/wall.md
      - C Cropland Structure:
        - c1 Annual arable bare / seedbed: classes/cropland-structure/annual-arable-bare.md
        - c2 Annual arable crop canopy: classes/cropland-structure/annual-arable-crop-canopy.md
        - c3 Annual arable stubble / post-harvest: classes/cropland-structure/annual-arable-stubble.md
        - c4 Permanent row crop trellis / rows: classes/cropland-structure/permanent-row-crop.md
      - V Vegetation Structure:
        - v1 Broadleaved canopy: classes/vegetation-structure/broadleaved-canopy.md
        - v2 Conifer canopy: classes/vegetation-structure/conifer-canopy.md
        - v3 Hedgerow: classes/vegetation-structure/hedgerow.md
        - v4 Scrub: classes/vegetation-structure/scrub.md
        - v5 Gorse-dominant scrub: classes/vegetation-structure/gorse-dominant-scrub.md
        - v6 Dwarf shrub heath structure: classes/vegetation-structure/dwarf-shrub-heath.md
        - v7 Brackenor fern: classes/vegetation-structure/bracken-dominant.md
        - v8 Short smooth grass sward: classes/vegetation-structure/short-smooth-grass.md
        - v9 Rough taller grass: classes/vegetation-structure/rough-taller-grass.md
        - v10 Tussocky grass: classes/vegetation-structure/tussocky-grass.md
        - v11 Molinia-dominant grass: classes/vegetation-structure/molinia-dominant.md
        - v12 Peatland grass & rush mosaic: classes/vegetation-structure/peatland-grass-rush-mosaic.md
        - v13 Rush-dominant: classes/vegetation-structure/rush-dominant.md
        - v14 Reedbed: classes/vegetation-structure/reedbed.md
        - v15 Tall herb fen & marsh mix: classes/vegetation-structure/tall-herb-fen-marsh.md
        - v16 Wet bryophyte carpet: classes/vegetation-structure/wet-bryophyte-carpet.md
        - v17 Clear-fell & brash-dominant: classes/vegetation-structure/clear-fell-brash.md
        - v18 Young plantation (rows visible): classes/vegetation-structure/young-plantation.md
        - v19 Tree whips & early planting: classes/vegetation-structure/tree-whips-early-planting.md
      - W Water:
        - w1 Open standing water: classes/water/open-standing-water.md
        - w2 Flowing or channel water: classes/water/flowing-channel-water.md
      - U Unclassified:
        - Overview: classes/unclassified/index.md